name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de Node.js (version de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Installation des dépendances (fichier de verrouillage, sans scripts)
        run: npm ci --ignore-scripts

      - name: Génération de la SBOM (CycloneDX, hors du dépôt)
        run: npm sbom --sbom-format cyclonedx --sbom-type application > "$RUNNER_TEMP/sbom.cdx.json"

      - name: Publication de la SBOM (artefact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Tests (vérification des types puis Vitest)
        run: npm test
